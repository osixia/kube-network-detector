apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vips.network.cloud.osixia.net
spec:
  group: network.cloud.osixia.net
  scope: Namespaced
  names:
    kind: VIP
    plural: vips
    singular: vip
    shortNames: [nvip]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Address
          type: string
          jsonPath: .spec.address
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [address]
              properties:
                address:
                  type: string
                  minLength: 1
                  maxLength: 45
                  description: Canonical unicast IPv4 or IPv6 VIP to observe; no CIDR or brackets.
                  x-kubernetes-validations:
                    - rule: isIP(self)
                      message: address must be an IPv4 or IPv6 address
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: peers.network.cloud.osixia.net
spec:
  group: network.cloud.osixia.net
  scope: Namespaced
  names:
    kind: Peer
    plural: peers
    singular: peer
    shortNames: [npeer]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Address
          type: string
          jsonPath: .spec.address
        - name: Port
          type: integer
          jsonPath: .spec.port
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [address, port]
              properties:
                address:
                  type: string
                  minLength: 1
                  maxLength: 45
                  description: Unicast IPv4 or IPv6 TCP endpoint; no CIDR or brackets.
                  x-kubernetes-validations:
                    - rule: isIP(self)
                      message: address must be an IPv4 or IPv6 address
                port:
                  type: integer
                  minimum: 1
                  maximum: 65535
---
apiVersion: v1
kind: Namespace
metadata:
  name: kube-network-detector
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-network-detector
  namespace: kube-network-detector
---
apiVersion: v1
kind: Secret
metadata:
  name: kube-network-detector-auth
  namespace: kube-network-detector
type: Opaque
stringData:
  # Replace this example key before using the manifest in production.
  hmac-key: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-network-detector
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, patch]
  - apiGroups: [network.cloud.osixia.net]
    resources: [vips, peers]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-network-detector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-network-detector
subjects:
  - kind: ServiceAccount
    name: kube-network-detector
    namespace: kube-network-detector
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kube-network-detector-leases
  namespace: kube-network-detector
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kube-network-detector-leases
  namespace: kube-network-detector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kube-network-detector-leases
subjects:
  - kind: ServiceAccount
    name: kube-network-detector
    namespace: kube-network-detector
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-network-detector
  namespace: kube-network-detector
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-network-detector
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-network-detector
    spec:
      serviceAccountName: kube-network-detector
      nodeSelector:
        kubernetes.io/os: linux
      # Respond on control-plane nodes as well as workers.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kube-network-detector
          image: osixia/kube-network-detector
          imagePullPolicy: IfNotPresent
          args:
            - --vip-label-prefix=kube-network-detector/
            - --peer-label-prefix=kube-network-detector/peer-
            - --port=9876
            - --log-level=info
            - --log-format=console
            - --dry-run=false
          env:
            - name: KUBE_NETWORK_DETECTOR_KEY
              valueFrom:
                secretKeyRef:
                  name: kube-network-detector-auth
                  key: hmac-key
            - name: KUBE_NETWORK_DETECTOR_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: KUBE_NETWORK_DETECTOR_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: KUBE_NETWORK_DETECTOR_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          ports:
            - name: probe
              containerPort: 9876
              hostPort: 9876
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: probe
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: probe
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
